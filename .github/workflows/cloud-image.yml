name: Build Cloud API Docker image

on:
  workflow_dispatch:
    inputs:
      push_image:
        description: Publish the image to GitHub Container Registry (GHCR)
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ inputs.push_image }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/cloud/Dockerfile
          push: ${{ inputs.push_image }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/liteshop-cloud-api:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/liteshop-cloud-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print image reference
        run: echo "ghcr.io/${{ github.repository_owner }}/liteshop-cloud-api:${{ github.sha }}"
