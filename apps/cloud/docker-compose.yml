services:
  cloud-api:
    build:
      context: ../..
      dockerfile: apps/cloud/Dockerfile
    ports:
      - "8787:8787"
    environment:
      LITESHOP_TERMINAL_TOKEN: ${LITESHOP_TERMINAL_TOKEN:?set terminal token}
      LITESHOP_MINIAPP_TOKEN: ${LITESHOP_MINIAPP_TOKEN:?set miniapp token}
      LITESHOP_ADMIN_TOKEN: ${LITESHOP_ADMIN_TOKEN:?set admin token}
      LITESHOP_SMTP_HOST: ${LITESHOP_SMTP_HOST:-}
      LITESHOP_SMTP_PORT: ${LITESHOP_SMTP_PORT:-587}
      LITESHOP_SMTP_USERNAME: ${LITESHOP_SMTP_USERNAME:-}
      LITESHOP_SMTP_PASSWORD: ${LITESHOP_SMTP_PASSWORD:-}
      LITESHOP_SMTP_FROM: ${LITESHOP_SMTP_FROM:-}
      LITESHOP_SMTP_SSL: ${LITESHOP_SMTP_SSL:-0}
    volumes:
      - cloud-data:/data
    restart: unless-stopped
volumes:
  cloud-data:
