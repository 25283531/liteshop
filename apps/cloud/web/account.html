<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LiteShop 云端账户</title><link rel="stylesheet" href="/account/app.css"></head>
<body><header><div><h1>LiteShop 云端服务</h1><p id="status">请注册或登录</p></div><a href="/">管理员入口</a></header>
<main><section id="auth" class="grid"><form id="register" class="panel"><h2>邮箱注册</h2><input id="reg-email" type="email" placeholder="邮箱" required><input id="reg-user" placeholder="用户名" minlength="2" maxlength="64" required><input id="reg-password" type="password" placeholder="密码（至少 8 位）" minlength="8" required><button>注册并发送邮件</button></form><form id="login" class="panel"><h2>登录</h2><input id="login-email" type="email" placeholder="邮箱" required><input id="login-password" type="password" placeholder="密码" required><button>登录</button></form></section>
<section id="dashboard" hidden><div class="panel"><h2 id="welcome"></h2><form id="bind"><label>绑定终端序列号<input id="serial" pattern="[A-Za-z0-9]{16}" maxlength="16" placeholder="终端设置页显示的 16 位序列号" required></label><button>绑定终端</button></form><p class="muted">终端至少成功同步一次后才能绑定。</p></div><div class="grid"><section class="panel"><h2>我的门店和终端</h2><div id="shops"></div></section><section class="panel"><h2>增值服务</h2><p class="muted">申请后由运营者配置微信服务凭据并开通。</p><div id="services"></div></section></div><section class="panel"><h2>会员数据</h2><select id="shop-select"><option value="">全部已绑定门店</option></select><button id="load-members">查询</button><div id="members"></div></section><section class="panel"><h2>公众号群发任务</h2><form id="campaign"><select id="campaign-shop" required></select><select id="campaign-channel"><option value="WECHAT_BROADCAST">公众号群发</option><option value="WECHAT_NOTICE">公众号通知</option></select><textarea id="campaign-content" maxlength="2000" placeholder="消息内容" required></textarea><button>创建店铺隔离任务</button></form><p class="muted">任务只会发送到所选店铺的关注者，实际发送需运营者完成公众号配置。</p></section></section></main><script src="/account/app.js"></script></body></html>
