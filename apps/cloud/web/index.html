<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LiteShop 云端管理</title><link rel="stylesheet" href="/admin/app.css">
</head>
<body>
  <header><div><h1>LiteShop 云端管理</h1><p id="status">未连接</p></div><button id="refresh">刷新数据</button></header>
  <main>
    <section id="login" class="panel"><h2>管理员登录</h2><p>请输入部署时设置的 <code>LITESHOP_ADMIN_TOKEN</code>。令牌只保存在本浏览器。</p><form id="login-form"><input id="token" type="password" autocomplete="off" placeholder="管理员令牌" required><button>进入管理台</button></form></section>
    <section id="dashboard" hidden>
      <div id="cards" class="cards"></div>
      <div class="grid"><section class="panel"><h2>云端设置</h2><form id="settings-form"><label>管理台显示名称<input id="display-name" maxlength="200"></label><label>公告/备注<textarea id="notice" maxlength="200"></textarea></label><button>保存设置</button></form><p id="settings-message"></p></section><section class="panel"><h2>终端</h2><div id="terminals"></div></section></div>
      <div class="grid"><section class="panel"><h2>门店</h2><div id="shops"></div></section><section class="panel"><h2>使用说明</h2><p>云端数据库是终端账本的同步投影。会员、卡和积分数据由安卓机顶盒上传；交易操作仍应在终端完成。</p><p>管理员令牌仅用于此页面和管理接口，请使用 HTTPS 反向代理后再开放公网访问。</p></section></div>
    </section>
  </main>
  <script src="/admin/app.js"></script>
</body>
</html>
