<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LiteShop 云端登录</title><link rel="stylesheet" href="/account/app.css"></head>
<body>
<header><div><h1>LiteShop 云端服务</h1><p id="status">登录后管理已绑定的门店和终端</p></div></header>
<main class="auth-shell">
  <section class="panel auth-card">
    <h2>登录</h2>
    <p class="muted">普通用户使用注册邮箱登录；管理员使用管理员账户名登录。</p>
    <form id="user-login">
      <label for="login-identity">邮箱或管理员账号</label>
      <input id="login-identity" autocomplete="username" placeholder="请输入邮箱或管理员账号" required>
      <label for="login-password">密码</label>
      <input id="login-password" type="password" autocomplete="current-password" placeholder="请输入密码" required>
      <button class="primary-action">登录并进入云端</button>
    </form>
    <div class="auth-links"><span>还没有云端账户？</span><a href="/register">新账户注册</a></div>
  </section>
</main>
<script src="/app.js"></script>
</body></html>
