[project]
name = "liteshop"
version = "0.2.0"
description = "Local-first membership ledger"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[tool.setuptools.packages.find]
include = ["liteshop*", "apps", "apps.web", "apps.cloud"]

[tool.setuptools.package-data]
"liteshop.storage" = ["migrations/*.sql"]
"apps.web" = ["public/*.html", "public/*.css", "public/*.js"]
